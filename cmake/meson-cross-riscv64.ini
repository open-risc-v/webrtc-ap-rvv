[binaries]
c = 'riscv64-linux-gnu-gcc'
cpp = 'riscv64-linux-gnu-g++'
ar = 'riscv64-linux-gnu-ar'
strip = 'riscv64-linux-gnu-strip'
pkgconfig = 'pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'riscv64'
cpu = 'riscv64'
endian = 'little'

[properties]
# 必须限定到 riscv sysroot：否则 pkg-config 会返回宿主 x86 的 .so，链接时撞
# "file in wrong format"（pixman 找 libpng16.so 就是这么炸的）。
pkg_config_libdir = '/usr/riscv64-linux-gnu/lib/pkgconfig:/usr/riscv64-linux-gnu/share/pkgconfig'
needs_exe_wrapper = true

[built-in options]
c_args = ['-march=rv64gc', '-O3']
cpp_args = ['-march=rv64gc', '-O3']
